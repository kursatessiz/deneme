name: Continuous Integration & Automated Tests

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop

jobs:
  test-and-verify:
    name: Run Lint, Typecheck, Prisma & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.15.4

      - name: Cache pnpm Modules
        uses: actions/cache@v6
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Validate Prisma Schema
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/test?schema=public"
        run: |
          cd packages/database
          npx prisma validate

      - name: Generate Prisma Client
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/test?schema=public"
        run: |
          cd packages/database
          npx prisma generate

      - name: Typecheck Entire Monorepo
        run: pnpm turbo run typecheck

      - name: Run Automated Unit Tests (Jest)
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/test?schema=public"
          JWT_SECRET: "test-secret-key-for-unit-testing-purposes-only-12345"
        run: pnpm turbo run test

      - name: Verify Build
        run: pnpm turbo run build --filter=@pilates/shared... --filter=@pilates/database...
