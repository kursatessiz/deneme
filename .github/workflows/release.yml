name: Release

# main -> CI -> build, sign and push images -> deploy with smoke test and
# automatic rollback. Deploy is skipped until the repository variable
# DEPLOY_ENABLED is "true" and the production environment is configured.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing image tag to deploy (e.g. sha-<commit>). Empty = build this commit.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    if: inputs.tag == ''
    uses: ./.github/workflows/ci.yml

  publish:
    name: Build and publish images
    needs: ci
    if: inputs.tag == ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write      # build provenance attestation
      attestations: write
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Image name
        id: image
        env:
          REPO: ${{ github.repository }}
          APP: ${{ matrix.app }}
        run: echo "name=ghcr.io/${REPO,,}/${APP}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/${{ matrix.app }}.Dockerfile
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
            ${{ steps.image.outputs.name }}:main
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  deploy:
    name: Deploy to production
    needs: publish
    if: >-
      always() && vars.DEPLOY_ENABLED == 'true' &&
      (needs.publish.result == 'success' || (needs.publish.result == 'skipped' && inputs.tag != ''))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Add required reviewers or a wait timer to this environment in
    # Settings > Environments to gate production deploys.
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pinned host key from a secret; no trust-on-first-use keyscan.
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Sync deploy files
        env:
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
        run: |
          SSH="ssh -i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=yes"
          $SSH "$TARGET" 'mkdir -p /opt/app/caddy /opt/app/scripts'
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes deploy/docker-compose.prod.yml "$TARGET:/opt/app/"
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes deploy/caddy/Caddyfile "$TARGET:/opt/app/caddy/"
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes deploy/scripts/*.sh "$TARGET:/opt/app/scripts/"

      - name: Deploy, smoke test, roll back on failure
        env:
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          TAG: ${{ inputs.tag || format('sha-{0}', github.sha) }}
        run: |
          [[ "$TAG" =~ ^[A-Za-z0-9._-]{1,128}$ ]] || { echo "invalid tag"; exit 2; }
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$TARGET" "bash /opt/app/scripts/deploy.sh '$TAG'"
          echo "Deployed \`$TAG\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove key
        if: always()
        run: rm -f ~/.ssh/deploy_key
