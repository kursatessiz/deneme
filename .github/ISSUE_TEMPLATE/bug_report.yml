name: Bug report
description: Report a bug in the platform
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        You are filing a bug report for the platform. Please fill in the fields below as
        completely as you can.
  - type: textarea
    id: what-happened
    attributes:
      label: Describe the bug
      description: Explain the bug in detail.
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
      description: What steps reliably reproduce the bug?
      placeholder: |
        1. Go to /calendar
        2. Click "New session"
        3. ...
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Affected component
      options:
        - "apps/web (admin panel / dashboard)"
        - "apps/api (backend REST API)"
        - "apps/mobile (Expo mobile app)"
        - "packages/database (Prisma / Postgres)"
        - "deploy (Docker / Caddy / CI/CD)"
    validations:
      required: true
