name: Bug report
description: Platformdaki bir hatayı bildirin
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Platform için bir hata bildirimi dolduruyorsunuz. Lütfen aşağıdaki alanları
        elinizden geldiğince eksiksiz doldurun.
  - type: textarea
    id: what-happened
    attributes:
      label: Hatayı açıklayın
      description: Hatayı ayrıntılı olarak açıklayın.
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Yeniden üretme adımları
      description: Hatayı hangi adımlar güvenilir şekilde yeniden üretiyor?
      placeholder: |
        1. /calendar sayfasına gidin
        2. "New session" düğmesine tıklayın
        3. ...
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Etkilenen bileşen
      options:
        - "apps/web (yönetim paneli / dashboard)"
        - "apps/api (backend REST API)"
        - "apps/mobile (Expo mobil uygulama)"
        - "packages/database (Prisma / Postgres)"
        - "deploy (Docker / Caddy / CI/CD)"
    validations:
      required: true
