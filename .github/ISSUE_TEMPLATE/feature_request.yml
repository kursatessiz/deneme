name: Feature request
description: Platform için yeni bir özellik veya modül önerin
labels: ["enhancement"]
body:
  - type: textarea
    id: feature-description
    attributes:
      label: Özellik açıklaması
      description: Bu özellik ne yapardı?
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: Kullanım senaryosu
      description: Bir stüdyo sahibi, antrenör veya üye bu özelliği nasıl kullanırdı?
    validations:
      required: true
