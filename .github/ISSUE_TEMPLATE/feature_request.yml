name: Feature request
description: Suggest a new feature or module for the platform
labels: ["enhancement"]
body:
  - type: textarea
    id: feature-description
    attributes:
      label: Feature description
      description: What would this feature do?
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: How would a studio owner, trainer or member use this feature?
    validations:
      required: true
