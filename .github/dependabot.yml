version: 2
updates:
  # Minor and patch updates are grouped into one PR per week. Majors are
  # done by hand (#6 bundled 33 majors and broke main).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Skip versions younger than a week: most malicious publishes are
    # caught and yanked within days.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    ignore:
      # Framework majors (TypeScript, NestJS, Prisma, Next, Tailwind, Zod...)
      # are planned upgrades tracked in HANDOVER.md, not bot PRs. Security
      # fixes still arrive through Dependabot security updates.
      - dependency-name: '*'
        update-types: [version-update:semver-major]
      # Expo pins exact react / react-native versions per SDK. They move only
      # with an Expo SDK upgrade (npx expo install --fix), never on their own.
      - dependency-name: react-native
      - dependency-name: react
        update-types: [version-update:semver-minor, version-update:semver-major]
      - dependency-name: '@types/react'
        update-types: [version-update:semver-minor, version-update:semver-major]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: build(deps)

  - package-ecosystem: docker
    directories: [/deploy/docker]
    schedule:
      interval: weekly
    # Stay on the Node.js LTS line; moving to the next LTS is a deliberate
    # change (engines, CI node-version and images together), not a bot PR.
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]
    commit-message:
      prefix: build(docker)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci(deps)
