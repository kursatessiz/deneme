version: 2
updates:
  # Minor and patch updates are grouped into one PR per week. Majors arrive
  # as separate PRs so a breaking upgrade cannot hide in a batch (#6 bundled
  # 33 majors and broke main).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Skip versions younger than a week: most malicious publishes are
    # caught and yanked within days.
    cooldown:
      default-days: 7
      semver-major-days: 14
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: build(deps)

  - package-ecosystem: docker
    directories: [/deploy/docker]
    schedule:
      interval: weekly
    commit-message:
      prefix: build(docker)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci(deps)
