services:
  # Caddy Reverse Proxy & Automatic SSL
  caddy:
    image: caddy:2-alpine
    container_name: pilates_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - web_net
    depends_on:
      - api
      - web
    deploy:
      resources:
        limits:
          memory: 128M

  # NestJS API (Yerel Koddan Derlenir - 0 Harici Registry)
  api:
    build:
      context: ..
      dockerfile: deploy/docker/api.Dockerfile
    image: pilates-api:local
    container_name: pilates_api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-pilates_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-pilates_prod}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      SMS_PROVIDER: ${SMS_PROVIDER:-MOCK}
      NETGSM_USER: ${NETGSM_USER:-}
      NETGSM_PASSWORD: ${NETGSM_PASSWORD:-}
      NETGSM_HEADER: ${NETGSM_HEADER:-}
      CORS_ORIGIN: "https://${WEB_DOMAIN:-localhost}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - web_net
      - internal_net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:4000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M

  # Next.js 15 Web & Panel (Yerel Koddan Derlenir - Standalone)
  web:
    build:
      context: ..
      dockerfile: deploy/docker/web.Dockerfile
    image: pilates-web:local
    container_name: pilates_web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: https://${API_DOMAIN:-localhost:4000}/api
    networks:
      - web_net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M

  # PostgreSQL 16
  postgres:
    image: postgres:16-alpine
    container_name: pilates_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pilates_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password required}
      POSTGRES_DB: ${POSTGRES_DB:-pilates_prod}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal_net
    command: >
      postgres
      -c shared_buffers=512MB
      -c work_mem=16MB
      -c maintenance_work_mem=128MB
      -c effective_cache_size=1536MB
      -c max_connections=100
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pilates_admin} -d ${POSTGRES_DB:-pilates_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 768M

  # Redis 7
  redis:
    image: redis:7-alpine
    container_name: pilates_redis
    restart: unless-stopped
    command: redis-server --requirepass "${REDIS_PASSWORD:?Redis password required}" --maxmemory 256mb --maxmemory-policy allkeys-lru --save 60 1
    volumes:
      - redis_data:/data
    networks:
      - internal_net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

networks:
  web_net:
    driver: bridge
  internal_net:
    internal: true

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data:
