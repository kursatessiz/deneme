services:
  postgres:
    image: postgres:16-alpine
    container_name: pilates_dev_postgres
    restart: always
    environment:
      POSTGRES_USER: pilates_user
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: pilates_dev
    ports:
      - "5432:5432"
    volumes:
      - dev_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: pilates_dev_redis
    restart: always
    command: redis-server --requirepass dev_redis_pass
    ports:
      - "6379:6379"
    volumes:
      - dev_redis_data:/data

volumes:
  dev_postgres_data:
  dev_redis_data:
