services:
  # Caddy Reverse Proxy & Automatic SSL
  caddy:
    image: caddy:2-alpine
    container_name: pilates_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3 QUIC
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - web_net
    depends_on:
      - api
      - web
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.5'

  # NestJS Core API + BullMQ Queue
  api:
    image: ${API_IMAGE:-ghcr.io/your-org/pilates-api:latest}
    container_name: pilates_api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      SMS_PROVIDER: ${SMS_PROVIDER:-MOCK}
      NETGSM_USER: ${NETGSM_USER:-}
      NETGSM_PASSWORD: ${NETGSM_PASSWORD:-}
      NETGSM_HEADER: ${NETGSM_HEADER:-}
      CORS_ORIGIN: "https://${WEB_DOMAIN:-localhost}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - web_net
      - internal_net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:4000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'

  # Next.js 15 Standalone Web & Admin Dashboard
  web:
    image: ${WEB_IMAGE:-ghcr.io/your-org/pilates-web:latest}
    container_name: pilates_web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: https://${API_DOMAIN:-localhost:4000}/api
    networks:
      - web_net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'

  # PostgreSQL 16 (Tuned for 6GB VPS)
  postgres:
    image: postgres:16-alpine
    container_name: pilates_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pilates_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password required}
      POSTGRES_DB: ${POSTGRES_DB:-pilates_prod}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal_net
    command: >
      postgres
      -c shared_buffers=512MB
      -c work_mem=16MB
      -c maintenance_work_mem=128MB
      -c effective_cache_size=1536MB
      -c max_connections=100
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pilates_admin} -d ${POSTGRES_DB:-pilates_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: '1.5'

  # Redis 7 Alpine (In-memory Queue & Cache)
  redis:
    image: redis:7-alpine
    container_name: pilates_redis
    restart: unless-stopped
    command: redis-server --requirepass "${REDIS_PASSWORD:?Redis password required}" --maxmemory 256mb --maxmemory-policy allkeys-lru --save 60 1
    volumes:
      - redis_data:/data
    networks:
      - internal_net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

networks:
  web_net:
    driver: bridge
  internal_net:
    internal: true

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data:
