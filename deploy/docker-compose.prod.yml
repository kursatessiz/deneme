# Production stack. Images are built in CI and only pulled here.
# Required in /opt/app/.env: IMAGE_REPO, POSTGRES_PASSWORD, REDIS_PASSWORD,
# JWT_SECRET, WEB_DOMAIN, API_DOMAIN, ACME_EMAIL (see .env.example, which
# also lists every optional provider key). The same file serves preprod and
# production; only the values differ.
name: app

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      WEB_DOMAIN: ${WEB_DOMAIN:?WEB_DOMAIN required}
      API_DOMAIN: ${API_DOMAIN:?API_DOMAIN required}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL required}
      # production (default) or preprod: noindex header, no HSTS preload.
      SITE_ENV: ${SITE_ENV:-production}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [web_net]
    depends_on: [api, web]
    deploy:
      resources:
        limits: { memory: 128M, cpus: '0.5' }

  api:
    image: ${API_IMAGE:-${IMAGE_REPO:?IMAGE_REPO required}/api:latest}
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: 4000
      APP_VERSION: ${RELEASE_TAG:-unknown}
      # Tags every captured error with the deployed release (docs/HATA_RAPORLAMA.md).
      APP_RELEASE: ${RELEASE_TAG:-dev}
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-app}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
      CORS_ORIGIN: https://${WEB_DOMAIN}
      # Invite links (QR / SMS) point here: https://<web>/j/<token>
      PUBLIC_APP_URL: https://${WEB_DOMAIN}
      PUBLIC_API_URL: https://${API_DOMAIN}
      SMS_PROVIDER: ${SMS_PROVIDER:-MOCK}
      NETGSM_USER: ${NETGSM_USER:-}
      NETGSM_PASSWORD: ${NETGSM_PASSWORD:-}
      NETGSM_HEADER: ${NETGSM_HEADER:-}
      # -- Pass-through from /opt/app/.env (D1) ---------------------------
      # Every other key of apps/api/src/config/env.ts, listed explicitly so
      # a key can never be silently missing from the container; unset ones
      # arrive empty and the API treats empty as unset. The values above are
      # computed here and stay authoritative. apps/api/src/config/
      # compose-env.spec.ts fails when a schema key is neither listed here
      # nor in its "intentionally not passed" list (OTP_TEST_CODE,
      # AI_FAKE_PROVIDER: test-only, refused in production).
      # Tenant sites: <slug>.<SITES_DOMAIN>; empty falls back to WEB_DOMAIN.
      SITES_DOMAIN: ${SITES_DOMAIN:-}
      WEB_DOMAIN: ${WEB_DOMAIN}
      SMS_PROVIDER_LOW_BALANCE_THRESHOLD: ${SMS_PROVIDER_LOW_BALANCE_THRESHOLD:-}
      ILETI_MERKEZI_USER: ${ILETI_MERKEZI_USER:-}
      ILETI_MERKEZI_PASSWORD: ${ILETI_MERKEZI_PASSWORD:-}
      ILETI_MERKEZI_SENDER: ${ILETI_MERKEZI_SENDER:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      SMS_DLR_WEBHOOK_TOKEN: ${SMS_DLR_WEBHOOK_TOKEN:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      WHATSAPP_WEBHOOK_VERIFY_TOKEN: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN:-}
      IYS_BRAND_CODE: ${IYS_BRAND_CODE:-}
      IYS_API_KEY: ${IYS_API_KEY:-}
      SES_REGION: ${SES_REGION:-}
      SES_FROM_ADDRESS: ${SES_FROM_ADDRESS:-}
      SES_FROM_NAME: ${SES_FROM_NAME:-}
      SES_CONFIGURATION_SET: ${SES_CONFIGURATION_SET:-}
      SES_SNS_TOPIC_ARNS: ${SES_SNS_TOPIC_ARNS:-}
      # SES credentials for the AWS SDK default chain (not in the schema).
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      MESSAGING_TRACKING_SECRET: ${MESSAGING_TRACKING_SECRET:-}
      PUSH_PROVIDER: ${PUSH_PROVIDER:-}
      EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN:-}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_CHECKOUT_SUCCESS_URL: ${STRIPE_CHECKOUT_SUCCESS_URL:-}
      STRIPE_CHECKOUT_CANCEL_URL: ${STRIPE_CHECKOUT_CANCEL_URL:-}
      IYZICO_API_KEY: ${IYZICO_API_KEY:-}
      IYZICO_SECRET_KEY: ${IYZICO_SECRET_KEY:-}
      IYZICO_BASE_URL: ${IYZICO_BASE_URL:-}
      PAYTR_MERCHANT_ID: ${PAYTR_MERCHANT_ID:-}
      PAYTR_MERCHANT_KEY: ${PAYTR_MERCHANT_KEY:-}
      PAYTR_MERCHANT_SALT: ${PAYTR_MERCHANT_SALT:-}
      PARASUT_CLIENT_ID: ${PARASUT_CLIENT_ID:-}
      PARASUT_CLIENT_SECRET: ${PARASUT_CLIENT_SECRET:-}
      ELOGO_USERNAME: ${ELOGO_USERNAME:-}
      ELOGO_PASSWORD: ${ELOGO_PASSWORD:-}
      FORIBA_USERNAME: ${FORIBA_USERNAME:-}
      FORIBA_PASSWORD: ${FORIBA_PASSWORD:-}
      UYUMSOFT_USERNAME: ${UYUMSOFT_USERNAME:-}
      UYUMSOFT_PASSWORD: ${UYUMSOFT_PASSWORD:-}
      INTEGRATION_ENCRYPTION_KEY: ${INTEGRATION_ENCRYPTION_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      JITSI_BASE_URL: ${JITSI_BASE_URL:-}
      ERROR_USER_HASH_SALT: ${ERROR_USER_HASH_SALT:-}
      ERROR_CLIENT_SAMPLE_RATE: ${ERROR_CLIENT_SAMPLE_RATE:-}
      ERROR_ALERT_COOLDOWN_MINUTES: ${ERROR_ALERT_COOLDOWN_MINUTES:-}
      ERROR_ALERTS_ENABLED: ${ERROR_ALERTS_ENABLED:-}
      # D2 backups from the super admin panel (docs/YEDEKLER.md): the same
      # off-site settings backup.sh uses, and the host backup directory
      # mounted read-only (listing only).
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-db}
      BACKUP_S3_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      BACKUP_S3_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-}
      BACKUP_STALE_HOURS: ${BACKUP_STALE_HOURS:-26}
      BACKUP_DOWNLOAD_URL_TTL_SECONDS: ${BACKUP_DOWNLOAD_URL_TTL_SECONDS:-}
      BACKUP_PG_DUMP_PATH: ${BACKUP_PG_DUMP_PATH:-}
      BACKUP_LOCAL_DIR: /var/backups/app
    volumes:
      - ./backups:/var/backups/app:ro
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [web_net, internal_net]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    deploy:
      resources:
        # Node heap is capped at 512 MB in the image; the extra room covers
        # native memory so the container is not OOM-killed at the heap limit.
        limits: { memory: 768M, cpus: '1.0' }

  web:
    image: ${WEB_IMAGE:-${IMAGE_REPO:?IMAGE_REPO required}/web:latest}
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: 3000
      # Read at runtime (never inlined at build), so one image serves every
      # environment: the browser-facing API origin (lead forms, tracking,
      # embed widget; see apps/web/src/lib/public-api-url.ts) and the base
      # domain tenant sites hang off.
      PUBLIC_API_URL: https://${API_DOMAIN}
      SITES_DOMAIN: ${SITES_DOMAIN:-}
      WEB_DOMAIN: ${WEB_DOMAIN}
      # BFF (apps/web/src/app/api/bff/[...path]/route.ts) proxies to the API
      # over the internal docker network -- never the public API_DOMAIN, and
      # never baked into client bundles (no NEXT_PUBLIC_ prefix). See
      # docs/WEB_PANEL.md.
      API_INTERNAL_URL: http://api:4000
      APP_RELEASE: ${RELEASE_TAG:-dev}
    networks: [web_net, internal_net]
    read_only: true
    tmpfs: ["/tmp", "/app/apps/web/.next/cache:uid=1000,gid=1000"]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { memory: 768M, cpus: '1.0' }

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [internal_net]
    command: >
      postgres
      -c shared_buffers=512MB
      -c work_mem=16MB
      -c maintenance_work_mem=128MB
      -c effective_cache_size=1536MB
      -c max_connections=100
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        # shared_buffers (512 MB) plus per-connection work_mem needs headroom.
        limits: { memory: 1G, cpus: '1.5' }

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD required}
    command: >
      sh -c 'exec redis-server --requirepass "$$REDISCLI_AUTH"
      --maxmemory 256mb --maxmemory-policy noeviction --save 60 1'
    volumes:
      - redis_data:/data
    networks: [internal_net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        # maxmemory covers the dataset only; leave room for Redis overhead.
        limits: { memory: 320M, cpus: '0.5' }

networks:
  web_net:
    driver: bridge
  internal_net:
    internal: true

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data:
